# Builds the app and publishes a ready-to-run bundle to the `deploy` branch.
#
# GoDaddy's Node.js sandbox repeatedly fails partway through installing this
# project's ~1,550 packages — three different packages (@babel/helpers,
# prisma, sharp) have gone missing mid-install, with the sandbox logging
# "skipping path=/app/node_modules". Rather than fight an installer we do not
# control, everything is installed and compiled here, on Linux runners that
# match the host's platform, and the finished tree is pushed to a branch the
# host can run with no install step at all.
#
# The branch is rewritten as a single orphan commit each time so its history
# never accumulates hundreds of megabytes of node_modules.
name: Publish deploy bundle

on:
  push:
    branches: [master]
  workflow_dispatch:

# The default workflow token is read-only; publishing the bundle branch
# needs write access to contents.
permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend
        working-directory: backend
        run: |
          npm ci --include=dev
          npx prisma generate
          npm run build

      - name: Prune backend to runtime dependencies
        working-directory: backend
        run: |
          # The Prisma CLI is a devDependency but is needed at runtime for
          # `migrate deploy`, so it is reinstalled after pruning.
          npm prune --omit=dev
          npm install --no-save --omit=dev prisma@$(node -p "require('./package.json').devDependencies.prisma.replace(/^[^0-9]*/,'')")

      # The bundle is the API only. The site is served by Vercel, which runs
      # Next.js natively — and splitting them is what makes the API fit in the
      # hosting container at all: Next's server was 31MB of a budget that has
      # none to spare.
      - name: Assemble bundle
        run: |
          rm -rf bundle && mkdir -p bundle
          cp server.js database-url.js bundle/
          cp -r scripts bundle/scripts

          # Root manifest with no dependencies: `npm install` on the host has
          # nothing to do, which is the entire point.
          node -e "
            const fs = require('fs');
            fs.writeFileSync('bundle/package.json', JSON.stringify({
              name: 'infludubai', version: '1.0.0', private: true,
              main: 'server.js',
              // The compact boot log finally showed where the host kills the
              // process: during the require of the compiled app, silently — a
              // SIGKILL, since the exit handlers print every other kind of
              // death. That is the one moment allocation outruns collection,
              // and a 112MB cap still let the transient peak overshoot the
              // container. At 64MB V8 collects through the spike instead:
              // peak drops from ~110MB to 86MB, boot is faster (4.6s), and a
              // 30-request burst settles at 91MB.
              scripts: {
                start:
                  'node --max-old-space-size=64 --max-semi-space-size=2 server.js',
              },
              engines: { node: '>=20' }
            }, null, 2) + '\n');
          "

          mkdir -p bundle/backend
          cp -r backend/dist bundle/backend/dist
          cp -r backend/node_modules bundle/backend/node_modules
          cp -r backend/prisma bundle/backend/prisma
          cp backend/package.json bundle/backend/package.json

          # GoDaddy's pull preserves existing files and only overlays the new
          # ones, so migrations deleted in this repo survive on the host and
          # get replayed. This manifest lets the supervisor prune whatever
          # this build does not ship. See runMigrations() in server.js.
          node -e "
            const fs = require('fs');
            const dir = 'bundle/backend/prisma/migrations';
            const names = fs.readdirSync(dir, { withFileTypes: true })
              .filter((e) => e.isDirectory())
              .map((e) => e.name)
              .sort();
            fs.writeFileSync(dir + '/manifest.json', JSON.stringify({ migrations: names }, null, 2));
            console.log('Migration manifest: ' + names.join(', '));
          "
          # prisma.config.ts is deliberately not shipped: without it the CLI
          # falls back to prisma/schema.prisma and reads DATABASE_URL straight
          # from the environment, so the runtime bundle needs no TypeScript
          # loader and no dotenv.

          echo "Bundle size: $(du -sh bundle | cut -f1)"

      - name: Publish to deploy branch
        run: |
          cd bundle
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
